{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="login-scene">
    <div class="ticket login-card">
        <p class="eyebrow">No cash. No catch. Just trade.</p>
        <h1>Who's trading today?</h1>
        <p class="subtitle">Enter your username and password to browse the board, list an item, or make a claim.</p>
        <form method="POST">
            <label>Username
                <input type="text" name="username" required>
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <button type="submit">Enter the Post</button>
        </form>
        {% if error %}
        <p style="color:var(--rust); margin-top:0.75rem;">{{ error }}</p>
        {% endif %}
    </div>
    <div class="floating-stamp">EST. TODAY</div>
  </div>
</div>
{% endblock %}
