{% extends "base.html" %}
{% block content %}

<div class="ticket">
    <h2>List something to trade</h2>
    <form method="POST" action="{{ url_for('create_post_form') }}">
        <label>Title
            <input type="text" name="title" required>
        </label>
        <label>Description
            <input type="text" name="description" required>
        </label>
        <button type="submit">Pin to the board</button>
    </form>
</div>

<h2 class="section-title" style="font-family:'Special Elite',cursive;">The Board</h2>

<div class="marketplace-grid">
{% for post in posts %}
    <a class="card-link" href="{{ url_for('view_post', post_id=post.post_id) }}">
        <div class="item-card">
            <span class="stamp {{ post.status|lower }}">{{ post.status }}</span>
            <div class="thumb"></div>
            <h3>{{ post.title }}</h3>
            <p class="desc">{{ post.description }}</p>
            <p class="meta">Listed by trader #{{ post.owner_id }} &middot; Ticket #{{ post.post_id }}</p>
        </div>
    </a>
{% endfor %}
</div>

{% endblock %}
